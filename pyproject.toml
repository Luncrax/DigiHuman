[project]
name = "digihuman"
version = "0.1.0"
description = "DigiHuman virtual human assistant backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "redis==5.0.1",
    "openai==1.16.2",
    "loguru==0.7.2",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "httpx==0.27.0",
    "langchain-core==0.1.53",
    "langchain-openai==0.0.8",
    "pymilvus==2.4.0",
    "numpy==1.24.3",
    "tiktoken==0.5.2",
    "torch==2.1.1",
    "torchaudio==2.1.1",
    "torchvision==0.16.1",
    "edge-tts==6.1.10",
    "vosk==0.3.45",
    "sounddevice==0.4.6",
    "pyaudio==0.2.13",
    "websockets==12.0",
]

[project.scripts]
digihuman-server = "run_server:main"
digihuman-start-all = "start_all:main"

[tool.uv]
package = false
